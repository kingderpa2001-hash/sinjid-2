name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download Ruffle (không lấy source map)
        run: |
          npm pack @ruffle-rs/ruffle
          mkdir -p app/src/main/assets/ruffle
          tar -xzf ruffle-rs-ruffle-*.tgz -C /tmp
          cp /tmp/package/ruffle.js app/src/main/assets/ruffle/
          cp /tmp/package/core.ruffle.*.js app/src/main/assets/ruffle/ 2>/dev/null || true
          cp /tmp/package/*.wasm app/src/main/assets/ruffle/ 2>/dev/null || true
          find /tmp/package -name "*.js" ! -name "*.map" -exec cp {} app/src/main/assets/ruffle/ \;
          find /tmp/package -name "*.wasm" -exec cp {} app/src/main/assets/ruffle/ \;
          ls -lh app/src/main/assets/ruffle
          rm -f app/src/main/assets/ruffle/*.map
          du -sh app/src/main/assets/ruffle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Sinjid-apk
          path: app/build/outputs/apk/debug/app-debug.apk
