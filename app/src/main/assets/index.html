<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;background:#0a0612;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  touch-action:none;overscroll-behavior:none}
#p{position:fixed;inset:0;width:100%;height:100%}
#p ruffle-player{width:100%!important;height:100%!important;display:block}

#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
#ui.hide .ctl{opacity:0;pointer-events:none;transform:scale(.85)}
.ctl{transition:opacity .25s,transform .25s}

.ctl,#tg{pointer-events:auto;touch-action:none;-webkit-tap-highlight-color:transparent}

/* ===== JOYSTICK ===== */
#base{
  position:absolute;
  left:max(18px,env(safe-area-inset-left));
  bottom:max(20px,env(safe-area-inset-bottom));
  width:148px;height:148px;border-radius:50%;
  background:
    radial-gradient(circle at 50% 45%, rgba(90,60,140,.25) 0%, rgba(20,12,40,.55) 70%),
    rgba(15,10,30,.5);
  border:2px solid rgba(160,120,220,.35);
  box-shadow:
    0 0 0 1px rgba(0,0,0,.4),
    0 4px 20px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.08);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}
#base::after{
  content:'';position:absolute;inset:12px;border-radius:50%;
  border:1px dashed rgba(160,120,220,.2);pointer-events:none;
}
#knob{
  position:absolute;left:42px;top:42px;width:64px;height:64px;border-radius:50%;
  background:
    radial-gradient(circle at 35% 30%, rgba(200,170,255,.55), rgba(100,70,160,.9) 55%, rgba(50,30,90,1));
  border:2px solid rgba(210,180,255,.55);
  box-shadow:
    0 2px 8px rgba(0,0,0,.5),
    0 0 12px rgba(140,100,220,.35),
    inset 0 1px 0 rgba(255,255,255,.25);
}

/* ===== ACTION BUTTON ===== */
#act{
  position:absolute;
  right:max(24px,env(safe-area-inset-right));
  bottom:max(32px,env(safe-area-inset-bottom));
  width:100px;height:100px;border-radius:50%;
  background:
    radial-gradient(circle at 35% 28%, rgba(180,140,255,.4), rgba(80,45,140,.85) 50%, rgba(35,20,70,1));
  border:2px solid rgba(190,150,255,.5);
  color:#e8d8ff;
  font:700 13px/1.25 system-ui,-apple-system,sans-serif;
  letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;text-align:center;
  box-shadow:
    0 4px 16px rgba(0,0,0,.5),
    0 0 18px rgba(120,80,200,.3),
    inset 0 1px 0 rgba(255,255,255,.2);
  text-shadow:0 1px 2px rgba(0,0,0,.6);
}
#act.on{
  background:
    radial-gradient(circle at 35% 28%, rgba(220,190,255,.55), rgba(120,80,200,.95) 50%, rgba(60,35,110,1));
  border-color:rgba(230,200,255,.75);
  box-shadow:
    0 2px 10px rgba(0,0,0,.45),
    0 0 24px rgba(160,110,255,.55),
    inset 0 1px 0 rgba(255,255,255,.3);
  transform:scale(.94);
}
#act span{display:block;line-height:1.2}

/* ===== TOGGLE ===== */
#tg{
  position:absolute;
  right:max(10px,env(safe-area-inset-right));
  top:max(10px,env(safe-area-inset-top));
  width:44px;height:44px;border-radius:50%;
  background:rgba(25,15,45,.65);
  border:1.5px solid rgba(160,120,220,.4);
  color:#d4c0f0;
  font-size:18px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 10px rgba(0,0,0,.4);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
}
#tg:active{background:rgba(60,40,100,.75)}
</style>
<script>
window.RufflePlayer={config:{
  publicPath:"ruffle/",
  preferredRenderer:"webgpu",
  polyfills:true,
  autoplay:"on",
  unmuteOverlay:"hidden",
  splashScreen:false,
  letterbox:"on",
  scale:"showAll",
  quality:"high",
  favorHiFiTimers:true,
  logLevel:"warn"
}};
</script>
<script src="ruffle/ruffle.js"></script>
</head>
<body>
<div id="p"></div>
<div id="ui">
  <div class="ctl" id="base"><div id="knob"></div></div>
  <div class="ctl" id="act"><span>Tương<br>tác</span></div>
  <div id="tg">⚔</div>
</div>
<script>
(function(){
  var player,held={},timers={};
  var CODES={w:["KeyW",87],a:["KeyA",65],s:["KeyS",83],d:["KeyD",68]," ":["Space",32]};

  function fire(type,k,rep){
    var c=CODES[k]; if(!c) return;
    var e=new KeyboardEvent(type,{key:k,code:c[0],keyCode:c[1],which:c[1],repeat:!!rep,bubbles:true,cancelable:true});
    (player||document).dispatchEvent(e);
  }
  function press(k){
    if(held[k]) return; held[k]=true;
    if(player) try{player.focus();}catch(e){}
    fire("keydown",k,false);
    timers[k]=setInterval(function(){fire("keydown",k,true);},80);
  }
  function release(k){
    if(!held[k]) return; held[k]=false;
    clearInterval(timers[k]); delete timers[k];
    fire("keyup",k,false);
  }
  function releaseAll(){Object.keys(held).forEach(release);}

  window.addEventListener("load",function(){
    var r=window.RufflePlayer.newest();
    player=r.createPlayer();
    player.style.cssText="width:100%;height:100%;display:block;";
    document.getElementById("p").appendChild(player);
    player.ruffle().load({
      url:"game.swf",autoplay:"on",unmuteOverlay:"hidden",
      letterbox:"on",scale:"showAll",splashScreen:false,quality:"high"
    }).catch(function(e){console.warn(e);});
  });

  var base=document.getElementById("base"),knob=document.getElementById("knob");
  var R=74,KR=32,activeId=null;

  function stick(ev){
    var b=base.getBoundingClientRect();
    var dx=ev.clientX-(b.left+b.width/2), dy=ev.clientY-(b.top+b.height/2);
    var d=Math.sqrt(dx*dx+dy*dy), max=R-KR+6;
    if(d>max){dx=dx/d*max;dy=dy/d*max;}
    knob.style.left=(R-KR+dx)+"px"; knob.style.top=(R-KR+dy)+"px";
    var t=max*0.3;
    dx<-t?press("a"):release("a");
    dx>t?press("d"):release("d");
    dy<-t?press("w"):release("w");
    dy>t?press("s"):release("s");
  }
  function stickEnd(){
    activeId=null;
    knob.style.left=(R-KR)+"px"; knob.style.top=(R-KR)+"px";
    ["w","a","s","d"].forEach(release);
  }
  base.addEventListener("pointerdown",function(ev){ev.preventDefault();activeId=ev.pointerId;base.setPointerCapture(ev.pointerId);stick(ev);});
  base.addEventListener("pointermove",function(ev){if(ev.pointerId===activeId){ev.preventDefault();stick(ev);}});
  base.addEventListener("pointerup",stickEnd);
  base.addEventListener("pointercancel",stickEnd);
  base.addEventListener("pointerleave",function(ev){if(ev.pointerId===activeId)stickEnd();});

  var act=document.getElementById("act");
  act.addEventListener("pointerdown",function(ev){ev.preventDefault();act.setPointerCapture(ev.pointerId);act.classList.add("on");press(" ");});
  function actEnd(){act.classList.remove("on");release(" ");}
  act.addEventListener("pointerup",actEnd);
  act.addEventListener("pointercancel",actEnd);

  var ui=document.getElementById("ui");
  document.getElementById("tg").addEventListener("click",function(){
    ui.classList.toggle("hide");
    if(ui.classList.contains("hide")){stickEnd();actEnd();}
  });
  document.addEventListener("contextmenu",function(e){e.preventDefault();});
  document.addEventListener("visibilitychange",function(){if(document.hidden)releaseAll();});
})();
</script>
</body>
</html>
